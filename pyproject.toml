[project]
name = "bukvarix"
version = "0.1.0"
description = "Local Wordstat-like CLI over Bukvarix keyword/SERP dumps"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "numpy>=2.2.6",
]

[project.scripts]
bukvarix = "bukvarix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukvarix"]
