[project]
name = "bukvarix"
version = "0.1.0"
description = "Локальный аналог Wordstat поверх дампов ключевых слов Bukvarix"
readme = "README.md"
authors = [{ name = "net.paradox" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "packaging>=24.0",
    "keyring>=25.0",
]

[project.scripts]
bukvarix = "bukvarix.cli:main"

[project.urls]
Repository = "https://github.com/bolandeu/bukvarix"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukvarix"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Keep the bar where it is instead of letting new commands land untested.
# Raise it, never lower it.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
# docs/build.md/AGENTS.md/docs/examples.md embed Python snippets as a historical
# record of past experiments — ruff's markdown-aware formatter would keep
# "reformatting" that frozen prose on every run. Format actual source only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# RUF001-003 flag Cyrillic letters as "ambiguous" vs. Latin look-alikes —
# meaningless noise for a CLI whose entire domain (stopwords, queries,
# user-facing strings) is Russian text.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                # assert is the point of a test
"scripts/*" = ["S603", "S607"]      # subprocess with fixed argv lists (git, uv), no shell
# Dynamic WHERE/column-list SQL built from internal fixed choices (a mode
# name, a loop index, a stopword list already inserted via `repr()`) and
# DuckDB `?` placeholders for every actual value — never raw user text.
"src/bukvarix/core/db.py" = ["S608"]
"src/bukvarix/core/normalize.py" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
# Typer's `param: T = typer.Option(...)` style is a call in a default on purpose.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
